name: Tests and app smoke check

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact project dependencies
        run: python -m pip install -r requirements.txt
      - name: Train model and prepare local app artifacts
        run: python train.py
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Smoke-check Streamlit app with AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py").run()
          if app.exception:
              raise AssertionError([error.message for error in app.exception])
          labels = {metric.label for metric in app.metric}
          expected = {
              "Logistic regression · Brier score",
              "Majority baseline · Brier score",
              "Training-prevalence reference · Brier score",
          }
          assert expected <= labels, labels
          assert app.dataframe, "Dashboard did not render its evaluation tables"
          PY
